name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Install Ruff
        run: python -m pip install --constraint .github/ci-constraints.txt ruff
      - name: Check formatting
        run: ruff format --check src bench tests
      - name: Check required lint
        run: ruff check src bench tests
      - name: Review TRY004 (advisory)
        run: ruff check --select TRY004 --exit-zero src bench tests

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.17", "3.12.15", "3.13.16"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: python -m pip install --constraint .github/ci-constraints.txt setuptools wheel
      - name: Install project, test, and lint dependencies
        run: python -m pip install --no-build-isolation --constraint .github/ci-constraints.txt ".[test]" ruff
      - name: Run tests
        run: python -m pytest -q -m 'not local_data' -p no:cacheprovider
